name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            binary: bin/archivebridge.exe
            package: archivebridge-1.0.0-win-x64.zip
            package_root: archivebridge-1.0.0-win-x64
            legacy_package: archivebridge-0.1.0-win-x64.zip
            legacy_root: archivebridge-0.1.0-win-x64
            legacy_sha256: 87eb4edeb56b82aeec5c0004f2e1b1829d642290a3dd94925365c777bbdc2932
            legacy_sums_sha256: ea707fe62f41f5d4d7325ae743bbc1090aa13cf2b67215795ef152672523988c
            beta_package: archivebridge-0.2.0-win-x64.zip
            beta_root: archivebridge-0.2.0-win-x64
            beta_sha256: f58f998fd72fc5429f8372c433335c5e7dc0b808e2c4c55b3bdc379ad12881d4
            beta_sums_sha256: aad4c9bbc1f7322fbb797784dcbc4d2a1885c70ef4dc179eab6934f667ffde79
          - os: ubuntu-24.04
            platform: linux
            binary: bin/archivebridge
            package: archivebridge-1.0.0-linux-x64.tar.gz
            package_root: archivebridge-1.0.0-linux-x64
            legacy_package: archivebridge-0.1.0-linux-x64.tar.gz
            legacy_root: archivebridge-0.1.0-linux-x64
            legacy_sha256: 0e6052432347504381fc7eddcbeff073d56f81cf79ffb5f8b583c5376836c0b0
            legacy_sums_sha256: ea707fe62f41f5d4d7325ae743bbc1090aa13cf2b67215795ef152672523988c
            beta_package: archivebridge-0.2.0-linux-x64.tar.gz
            beta_root: archivebridge-0.2.0-linux-x64
            beta_sha256: a19c267efd936c11f3925464ac543bca8806d4dc65772c6380c285912215d2e2
            beta_sums_sha256: aad4c9bbc1f7322fbb797784dcbc4d2a1885c70ef4dc179eab6934f667ffde79
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODE_USE_SYSTEM_CA: '1'
      npm_config_strict_ssl: 'true'
      ARCHIVEBRIDGE_RUNNER_IMAGE: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/browser-tools/package-lock.json

      - name: Record native runner and full source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -B - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import sys
          if os.name == "nt":
              import winreg
          from pathlib import Path

          def command(*args):
              return subprocess.check_output(args, text=True, stderr=subprocess.STDOUT).strip()

          npm_executable = "npm.cmd" if os.name == "nt" else "npm"
          commit = command("git", "rev-parse", "HEAD").lower()
          expected = os.environ["GITHUB_SHA"].lower()
          if commit != expected or len(commit) != 40:
              raise SystemExit("checked out Git identity is not the full GitHub source commit")
          machine = platform.machine().lower()
          if machine not in ("amd64", "x86_64") or platform.architecture()[0] != "64bit":
              raise SystemExit(f"CI requires a native x64 runner, got {machine}")
          report = {
              "schemaVersion": 1,
              "runnerOS": os.environ.get("RUNNER_OS", ""),
              "runnerImage": os.environ.get("ARCHIVEBRIDGE_RUNNER_IMAGE", ""),
              "hostType": "GitHub-hosted runner",
              "platform": platform.platform(),
              "platformVersion": platform.version(),
              "machine": machine,
              "architecture": platform.architecture()[0],
              "python": sys.version,
              "go": command("go", "version"),
              "node": command("node", "--version"),
              "npm": command(npm_executable, "--version"),
              "npmStrictSSL": command(npm_executable, "config", "get", "strict-ssl"),
              "nodeUsesSystemCA": os.environ.get("NODE_USE_SYSTEM_CA"),
              "commit": commit,
          }
          if sys.platform.startswith("linux"):
              try:
                  os_release_text = Path("/etc/os-release").read_text(encoding="utf-8")
                  os_release = {}
                  for line in os_release_text.splitlines():
                      key, separator, value = line.partition("=")
                      if separator:
                          os_release[key] = value.strip().strip('"')
                  report["osRelease"] = os_release
                  report["osReleaseText"] = os_release_text
              except OSError as exc:
                  raise SystemExit(f"cannot record /etc/os-release: {exc}")
          elif sys.platform == "win32":
              windows = sys.getwindowsversion()
              with winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, r"SOFTWARE\Microsoft\Windows NT\CurrentVersion") as key:
                  caption = winreg.QueryValueEx(key, "ProductName")[0]
                  current_build = winreg.QueryValueEx(key, "CurrentBuildNumber")[0]
                  try:
                      update_build = winreg.QueryValueEx(key, "UBR")[0]
                  except FileNotFoundError:
                      update_build = None
              report["windowsVersion"] = {
                  "major": windows.major, "minor": windows.minor, "build": windows.build,
                  "platform": windows.platform, "servicePack": windows.service_pack,
                  "win32Version": platform.win32_ver(),
                  "caption": caption,
                  "registryBuild": current_build,
                  "updateBuild": update_build,
              }
          Path("artifacts/runner-info.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Go unit and integration tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/go-test-report.json \
            --stdout-log artifacts/go-test.jsonl \
            --stderr-log artifacts/go-test.stderr.log \
            -- go test -json -count=1 ./...

      - name: Go static analysis
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/go-vet-report.json \
            --stdout-log artifacts/go-vet.stdout.log \
            --stderr-log artifacts/go-vet.stderr.log \
            -- go vet ./...

      - name: Release packager tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/package-tests-report.json \
            --stdout-log artifacts/package-tests.stdout.log \
            --stderr-log artifacts/package-tests.stderr.log \
            -- python -B scripts/test_package.py

      - name: Independent acceptance-harness regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/acceptance-tests-report.json \
            --stdout-log artifacts/acceptance-tests.stdout.log \
            --stderr-log artifacts/acceptance-tests.stderr.log \
            -- python -B scripts/test_acceptance.py

      - name: Beta recovery-harness regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/beta-acceptance-tests-report.json \
            --stdout-log artifacts/beta-acceptance-tests.stdout.log \
            --stderr-log artifacts/beta-acceptance-tests.stderr.log \
            -- python -B scripts/test_beta_acceptance.py

      - name: Independent beta acceptance process-ownership regression test
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/beta-independent-review-tests-report.json \
            --stdout-log artifacts/beta-independent-review-tests.stdout.log \
            --stderr-log artifacts/beta-independent-review-tests.stderr.log \
            -- python -B scripts/test_beta_independent_review.py

      - name: Immich integration harness unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-integration-tests-report.json \
            --stdout-log artifacts/immich-integration-tests.stdout.log \
            --stderr-log artifacts/immich-integration-tests.stderr.log \
            -- python -B scripts/test_immich_integration.py

      - name: Independent Immich harness regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-independent-tests-report.json \
            --stdout-log artifacts/immich-independent-tests.stdout.log \
            --stderr-log artifacts/immich-independent-tests.stderr.log \
            -- python -B scripts/test_immich_independent.py

      - name: V1 published-package compatibility helper tests
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/v1-compatibility-tests-report.json \
            --stdout-log artifacts/v1-compatibility-tests.stdout.log \
            --stderr-log artifacts/v1-compatibility-tests.stderr.log \
            -- python -B scripts/test_v1_compatibility.py

      - name: Install pinned browser verification dependency
        shell: bash
        run: |
          set -euo pipefail
          npm_cmd=npm
          if [[ "$RUNNER_OS" == Windows ]]; then npm_cmd=npm.cmd; fi
          python -B scripts/ci-test-report.py \
            --report artifacts/npm-ci-report.json \
            --stdout-log artifacts/npm-ci.stdout.log \
            --stderr-log artifacts/npm-ci.stderr.log \
            -- "$npm_cmd" ci --prefix scripts/browser-tools --strict-ssl=true

      - name: Browser harness output-ownership regression test
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/browser-acceptance-tests-report.json \
            --stdout-log artifacts/browser-acceptance-tests.stdout.log \
            --stderr-log artifacts/browser-acceptance-tests.stderr.log \
            -- python -B scripts/browser-tools/test_acceptance.py

      - name: Audit pinned browser verification dependency
        shell: bash
        run: |
          set -euo pipefail
          npm_cmd=npm
          if [[ "$RUNNER_OS" == Windows ]]; then npm_cmd=npm.cmd; fi
          python -B scripts/ci-test-report.py \
            --report artifacts/npm-audit-report.json \
            --stdout-log artifacts/npm-audit.json \
            --stderr-log artifacts/npm-audit.stderr.log \
            -- "$npm_cmd" audit --prefix scripts/browser-tools --json --audit-level=high --strict-ssl=true

      - name: Install fresh Playwright Chromium and Linux dependencies
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/playwright-install-report.json \
            --stdout-log artifacts/playwright-install.stdout.log \
            --stderr-log artifacts/playwright-install.stderr.log \
            -- node scripts/browser-tools/node_modules/playwright/cli.js install --with-deps chromium

      - name: Load narrowly scoped Linux user-namespace profiles
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo timeout 5m apt-get update
          sudo timeout 5m apt-get install -y --no-install-recommends apparmor
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ ! -r "$restriction" || "$(<"$restriction")" != 1 ]]; then
            echo "Linux unprivileged-userns restriction must be enabled for sandboxed Chromium acceptance." >&2
            exit 1
          fi
          profile_source=$(mktemp)
          trap 'rm -f "$profile_source"' EXIT
          cat >"$profile_source" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile archivebridge-ci-chromium ${HOME}/.cache/ms-playwright/chromium-*/chrome-linux64/chrome flags=(unconfined) { userns, }
          profile archivebridge-ci-headless ${HOME}/.cache/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-linux64/chrome-headless-shell flags=(unconfined) { userns, }
          EOF
          sudo install -o root -g root -m 0644 "$profile_source" /etc/apparmor.d/archivebridge-ci
          sudo apparmor_parser -r /etc/apparmor.d/archivebridge-ci
          profiles=/sys/kernel/security/apparmor/profiles
          for name in archivebridge-ci-chromium archivebridge-ci-headless; do
            if ! sudo grep -Fq "$name" "$profiles"; then
              echo "AppArmor did not load the expected profile: $name" >&2
              exit 1
            fi
          done

      - name: Build native release binary with source identity
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p bin
          python -B scripts/ci-test-report.py \
            --report artifacts/go-build-report.json \
            --stdout-log artifacts/go-build.stdout.log \
            --stderr-log artifacts/go-build.stderr.log \
            -- go build -buildvcs=true -trimpath \
              -ldflags "-X main.version=1.0.0 -X main.commit=${GITHUB_SHA}" \
              -o "${{ matrix.binary }}" ./cmd/archivebridge

      - name: Run source acceptance against fixtures and browser
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/source-acceptance-command.json \
            --stdout-log artifacts/source-acceptance.stdout.log \
            --stderr-log artifacts/source-acceptance.stderr.log \
            -- python -B scripts/acceptance.py \
              --binary "${{ matrix.binary }}" \
              --expected-version 1.0.0 \
              --expected-commit "$GITHUB_SHA" \
              --fixtures-dir examples/sample \
              --out "artifacts/source acceptance"

      - name: Resolve the tested Immich helper image pins (Linux)
        if: runner.os == 'Linux'
        id: immich_images
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-image-pins-report.json \
            --stdout-log artifacts/immich-image-pins.stdout.log \
            --stderr-log artifacts/immich-image-pins.stderr.log \
            -- python -B -c '
          import importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("immich_integration", "scripts/immich-integration.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for name, image in sorted(module.IMAGES.items()):
                  output.write(f"{name}={image}\n")
          print(json.dumps(module.IMAGES, sort_keys=True))
          '

      - name: Pull pinned Immich server image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-server-image-pull-report.json \
            --stdout-log artifacts/immich-server-image-pull.stdout.log \
            --stderr-log artifacts/immich-server-image-pull.stderr.log \
            -- docker pull --platform linux/amd64 '${{ steps.immich_images.outputs.server }}'

      - name: Pull pinned Immich database image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-database-image-pull-report.json \
            --stdout-log artifacts/immich-database-image-pull.stdout.log \
            --stderr-log artifacts/immich-database-image-pull.stderr.log \
            -- docker pull --platform linux/amd64 '${{ steps.immich_images.outputs.database }}'

      - name: Pull pinned Immich cache image (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-cache-image-pull-report.json \
            --stdout-log artifacts/immich-cache-image-pull.stdout.log \
            --stderr-log artifacts/immich-cache-image-pull.stderr.log \
            -- docker pull --platform linux/amd64 '${{ steps.immich_images.outputs.redis }}'

      - name: Run real Immich integration against source binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-source-integration-command.json \
            --stdout-log artifacts/immich-source-integration.stdout.log \
            --stderr-log artifacts/immich-source-integration.stderr.log \
            -- python -B scripts/immich-integration.py \
              --binary bin/archivebridge \
              --expected-version 1.0.0 \
              --expected-commit "$GITHUB_SHA" \
              --out "artifacts/immich source integration"
          python -B scripts/ci-test-report.py \
            --report artifacts/immich-source-integration-validation-command.json \
            --stdout-log artifacts/immich-source-integration-validation.stdout.log \
            --stderr-log artifacts/immich-source-integration-validation.stderr.log \
            -- python -B -c '
          import json
          from pathlib import Path
          import collections, datetime as dt, hashlib, os, re
          report_path = Path("artifacts/immich source integration/integration-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          checks = report.get("checks")
          binary = report.get("binary", {})
          expected_checks = [
              "pinned_images", "loopback_only", "exact_server_version", "synthetic_account", "seven_scoped_key",
              "offline_unicode_preview", "remote_original_sha256", "source_date", "unicode_filename",
              "duplicate_content_multi_album", "readonly_remote_verification", "repeat_no_extra_resources",
              "seven_scope_preflight", "same_account_key_rotation_resume", "different_account_resume_refused",
              "source_dates_after_real_metadata_workers", "ambiguous_default_blocked_before_writes",
              "explicit_skips_and_excluded_relationships", "raw_sidecars_not_transferred",
              "skip_aware_readonly_verification", "skip_aware_resume", "accepted_upload_response_interruption",
              "durable_in_flight_journal", "explicit_resume_reconciles_full_sha256", "no_blind_upload_retry",
              "prior_resume_report_preserved", "takeout_date_survives_conflicting_embedded_exif_after_workers",
          ]
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          assert report.get("status") == "passed" and report.get("scope") == "native-real-immich-synthetic"
          assert report.get("qualification") is False and report.get("cleanup") == "passed"
          assert report.get("platform") == "Linux" and checks == expected_checks and len(set(checks)) == 27
          assert report.get("synthetic") is True and report.get("serverVersion") == "3.3.1"
          assert report.get("workers") == {"api": True, "microservices": True, "machineLearning": False}
          assert binary.get("version") == "1.0.0" and binary.get("commit") == __import__("os").environ["GITHUB_SHA"]
          helper_bytes = Path("scripts/immich-integration.py").read_bytes()
          helper = report.get("harness", {})
          require(helper == {"name": "immich-integration.py", "bytes": len(helper_bytes),
                             "sha256": hashlib.sha256(helper_bytes).hexdigest()}, "SOURCE_HELPER_IDENTITY_MISMATCH")
          binary_path = Path("bin/archivebridge").resolve(strict=True)
          binary_bytes = binary_path.read_bytes()
          require(type(binary.get("bytes")) is int and binary["bytes"] == len(binary_bytes)
                  and binary.get("sha256") == hashlib.sha256(binary_bytes).hexdigest(), "SOURCE_BINARY_IDENTITY_MISMATCH")
          commands = report.get("commands")
          command_names = ["version", "plan", "export", "immich", "immich", "immich", "immich", "plan", "export",
                           "immich", "immich", "immich", "plan", "export", "immich", "immich", "immich", "immich",
                           "immich", "plan", "export", "immich", "immich", "immich", "plan", "export", "immich",
                           "immich", "immich"]
          require(isinstance(commands, list) and len(commands) == 29, "NATIVE_COMMAND_COUNT_MISMATCH")
          for index, (command, expected_name) in enumerate(zip(commands, command_names), 1):
              args = command.get("arguments")
              require(type(command.get("number")) is int and command["number"] == index
                      and isinstance(args, list) and args and args[0] == expected_name
                      and type(command.get("exitCode")) is int, "NATIVE_COMMAND_INVENTORY_MISMATCH")
              expected_failure = index in {10, 12, 15, 16, 22}
              require((command["exitCode"] != 0) == expected_failure, "NATIVE_COMMAND_RESULT_MISMATCH")
          require(commands[21].get("termination") == "forced-owned-child-after-server-accepted-upload"
                  and type(commands[21].get("pid")) is int and commands[21]["pid"] > 0,
                  "FORCED_INTERRUPTION_EVIDENCE_MISSING")
          expected_dates = {
              "83807b4ef61c1d03497a389abee15f67f36fbc10506f767fdd69c1a044594153": ("2023-11-14T22:13:20Z", 2),
              "f9454317f83e5d8ab90431433bbe6a345f69f5d213138756db22e825168d034c": ("2023-11-15T22:13:20Z", 1),
              "932e3e709ffde373c75b1d6724b5d005aea9d5736c1bd119be867014a88f511c": ("2023-11-14T22:13:20Z", 1),
              "e898e7ad061e3e93536b44daba1ee0a5d1b548a42d3fe32f817978257f711109": ("2023-11-14T22:13:19Z", 1),
              "26875c6fd8f73fffc3cc259086fa808ec22003ee20d5e69e9df1335a0d0ba058": ("2023-11-14T22:13:20Z", 1),
          }
          observations = report.get("metadataObservations")
          require(isinstance(observations, list) and len(observations) == 6, "METADATA_OBSERVATION_COUNT_MISMATCH")
          observed_counts, ids_by_sha, seen_assets = collections.Counter(), {}, {}
          expected_fields = {"assetId", "mediaSHA256", "expectedSourceDate", "fileCreatedAt", "exifImageWidth",
                             "exifImageHeight", "dateTimeOriginal"}
          def parse_utc(value):
              parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              require(parsed.tzinfo is not None, "METADATA_TIMESTAMP_MISSING_TIMEZONE")
              return parsed.astimezone(dt.timezone.utc)
          for observation in observations:
              require(isinstance(observation, dict) and set(observation) == expected_fields,
                      "METADATA_OBSERVATION_SHAPE_MISMATCH")
              media_sha = observation.get("mediaSHA256")
              require(media_sha in expected_dates, "METADATA_FIXTURE_SHA_MISMATCH")
              expected_date, _ = expected_dates[media_sha]
              require(observation.get("expectedSourceDate") == expected_date
                      and type(observation.get("exifImageWidth")) is int and observation["exifImageWidth"] == 320
                      and type(observation.get("exifImageHeight")) is int and observation["exifImageHeight"] == 200,
                      "METADATA_FIXTURE_OBSERVATION_MISMATCH")
              expected_utc = parse_utc(expected_date)
              require(parse_utc(observation.get("fileCreatedAt", "")) == expected_utc
                      and parse_utc(observation.get("dateTimeOriginal", "")) == expected_utc,
                      "POST_WORKER_DATE_MISMATCH")
              require(isinstance(observation.get("assetId"), str)
                      and re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", observation["assetId"]),
                      "METADATA_ASSET_ID_INVALID")
              observed_counts[media_sha] += 1
              ids_by_sha.setdefault(media_sha, set()).add(observation["assetId"])
              seen_assets.setdefault(observation["assetId"], set()).add(media_sha)
          require(observed_counts == collections.Counter({sha: count for sha, (_, count) in expected_dates.items()}),
                  "METADATA_FIXTURE_INVENTORY_MISMATCH")
          require(all(len(ids) == 1 for ids in ids_by_sha.values()) and len(seen_assets) == 5,
                  "METADATA_ASSET_IDENTITY_MISMATCH")
          exif_journal = json.loads((report_path.parent / "exif-import.json").read_text(encoding="utf-8"))
          exif_report = exif_journal.get("report", {})
          require(exif_report.get("dateTransferPolicy") == "takeout-date-authoritative-generated-xmp-v1"
                  and exif_report.get("contents", [{}])[0].get("sha256")
                      == "26875c6fd8f73fffc3cc259086fa808ec22003ee20d5e69e9df1335a0d0ba058",
                  "EXIF_SOURCE_DATE_POLICY_MISMATCH")
          print(json.dumps({"status": report["status"], "scope": report["scope"], "checks": len(checks),
                            "commands": len(commands), "metadataObservations": len(observations), "qualification": False}))
          '

      - name: Record real Immich integration not run on Windows
        if: runner.os == 'Windows'
