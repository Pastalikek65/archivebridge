      - name: Download and verify the published MVP compatibility package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'archivebridge-mvp-0.1.0'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $name = '${{ matrix.legacy_package }}'
          $base = 'https://github.com/Pastalikek65/archivebridge/releases/download/v0.1.0'
          $archive = Join-Path $directory $name
          $checksums = Join-Path $directory 'published-SHA256SUMS.txt'
          Invoke-WebRequest -Uri "$base/$name" -OutFile $archive
          Invoke-WebRequest -Uri "$base/SHA256SUMS.txt" -OutFile $checksums
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.legacy_sha256 }}') { throw 'Published MVP ZIP does not match the pinned release SHA-256.' }
          $checksumsHash = (Get-FileHash -LiteralPath $checksums -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksumsHash -ne '${{ matrix.legacy_sums_sha256 }}') { throw 'Published MVP SHA256SUMS.txt does not match its pinned release SHA-256.' }
          $expectedLine = "${{ matrix.legacy_sha256 }}  $name"
          $matching = @(Get-Content -LiteralPath $checksums | Where-Object { $_.TrimEnd("`r") -ceq $expectedLine })
          if ($matching.Count -ne 1) { throw 'Published SHA256SUMS.txt does not bind the pinned MVP ZIP exactly once.' }
          $unpacked = Join-Path $directory 'unpacked'
          New-Item -ItemType Directory -Path $unpacked | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked


