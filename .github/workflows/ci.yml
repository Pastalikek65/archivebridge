          assert report.get("qualification") is False and report.get("cleanup") == "passed"
          assert report.get("platform") == "Linux" and checks == expected_checks and len(set(checks)) == 27
          assert report.get("synthetic") is True and report.get("serverVersion") == "3.3.1"
          assert report.get("workers") == {"api": True, "microservices": True, "machineLearning": False}
          assert binary.get("version") == "1.0.0" and binary.get("commit") == os.environ["GITHUB_SHA"]
          helper_path = Path(os.environ["GITHUB_WORKSPACE"]) / "scripts" / "immich-integration.py"
          helper_bytes = helper_path.read_bytes()
          helper = report.get("harness", {})
          require(helper == {"name": "immich-integration.py", "bytes": len(helper_bytes),
                             "sha256": hashlib.sha256(helper_bytes).hexdigest()}, "PACKAGE_HELPER_IDENTITY_MISMATCH")
          binary_path = (Path(os.environ["RUNNER_TEMP"]) / "ArchiveBridge package acceptance with spaces" /
                         "unpacked package with spaces" / "archivebridge-1.0.0-linux-x64" / "archivebridge").resolve(strict=True)
          binary_bytes = binary_path.read_bytes()
          require(type(binary.get("bytes")) is int and binary["bytes"] == len(binary_bytes)
                  and binary.get("sha256") == hashlib.sha256(binary_bytes).hexdigest(), "PACKAGE_BINARY_IDENTITY_MISMATCH")
          commands = report.get("commands")
          command_names = ["version", "plan", "export", "immich", "immich", "immich", "immich", "plan", "export",
                           "immich", "immich", "immich", "plan", "export", "immich", "immich", "immich", "immich",
                           "immich", "plan", "export", "immich", "immich", "immich", "plan", "export", "immich",
                           "immich", "immich"]
          require(isinstance(commands, list) and len(commands) == 29, "PACKAGE_NATIVE_COMMAND_COUNT_MISMATCH")
          for index, (command, expected_name) in enumerate(zip(commands, command_names), 1):
              args = command.get("arguments")
              require(type(command.get("number")) is int and command["number"] == index
                      and isinstance(args, list) and args and args[0] == expected_name
                      and type(command.get("exitCode")) is int, "PACKAGE_NATIVE_COMMAND_INVENTORY_MISMATCH")
              expected_failure = index in {10, 12, 15, 16, 22}
              require((command["exitCode"] != 0) == expected_failure, "PACKAGE_NATIVE_COMMAND_RESULT_MISMATCH")
          require(commands[21].get("termination") == "forced-owned-child-after-server-accepted-upload"
                  and type(commands[21].get("pid")) is int and commands[21]["pid"] > 0,
                  "PACKAGE_FORCED_INTERRUPTION_EVIDENCE_MISSING")
          expected_dates = {
              "83807b4ef61c1d03497a389abee15f67f36fbc10506f767fdd69c1a044594153": ("2023-11-14T22:13:20Z", 2),
              "f9454317f83e5d8ab90431433bbe6a345f69f5d213138756db22e825168d034c": ("2023-11-15T22:13:20Z", 1),
              "932e3e709ffde373c75b1d6724b5d005aea9d5736c1bd119be867014a88f511c": ("2023-11-14T22:13:20Z", 1),
              "e898e7ad061e3e93536b44daba1ee0a5d1b548a42d3fe32f817978257f711109": ("2023-11-14T22:13:19Z", 1),
              "26875c6fd8f73fffc3cc259086fa808ec22003ee20d5e69e9df1335a0d0ba058": ("2023-11-14T22:13:20Z", 1),
          }
          observations = report.get("metadataObservations")
          require(isinstance(observations, list) and len(observations) == 6, "PACKAGE_METADATA_OBSERVATION_COUNT_MISMATCH")
          observed_counts, ids_by_sha, seen_assets = collections.Counter(), {}, {}
          expected_fields = {"assetId", "mediaSHA256", "expectedSourceDate", "fileCreatedAt", "exifImageWidth",
                             "exifImageHeight", "dateTimeOriginal"}
          def parse_utc(value):
              parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
              require(parsed.tzinfo is not None, "PACKAGE_METADATA_TIMESTAMP_MISSING_TIMEZONE")
              return parsed.astimezone(dt.timezone.utc)
          for observation in observations:
              require(isinstance(observation, dict) and set(observation) == expected_fields,
                      "PACKAGE_METADATA_OBSERVATION_SHAPE_MISMATCH")
              media_sha = observation.get("mediaSHA256")
              require(media_sha in expected_dates, "PACKAGE_METADATA_FIXTURE_SHA_MISMATCH")
              expected_date, _ = expected_dates[media_sha]
              require(observation.get("expectedSourceDate") == expected_date
                      and type(observation.get("exifImageWidth")) is int and observation["exifImageWidth"] == 320
                      and type(observation.get("exifImageHeight")) is int and observation["exifImageHeight"] == 200,
                      "PACKAGE_METADATA_FIXTURE_OBSERVATION_MISMATCH")
              expected_utc = parse_utc(expected_date)
              require(parse_utc(observation.get("fileCreatedAt", "")) == expected_utc
                      and parse_utc(observation.get("dateTimeOriginal", "")) == expected_utc,
                      "PACKAGE_POST_WORKER_DATE_MISMATCH")
              require(isinstance(observation.get("assetId"), str)
                      and re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", observation["assetId"]),
                      "PACKAGE_METADATA_ASSET_ID_INVALID")
              observed_counts[media_sha] += 1
              ids_by_sha.setdefault(media_sha, set()).add(observation["assetId"])
              seen_assets.setdefault(observation["assetId"], set()).add(media_sha)
          require(observed_counts == collections.Counter({sha: count for sha, (_, count) in expected_dates.items()}),
                  "PACKAGE_METADATA_FIXTURE_INVENTORY_MISMATCH")
          require(all(len(ids) == 1 for ids in ids_by_sha.values()) and len(seen_assets) == 5,
                  "PACKAGE_METADATA_ASSET_IDENTITY_MISMATCH")
          exif_journal = json.loads((report_path.parent / "exif-import.json").read_text(encoding="utf-8"))
          exif_report = exif_journal.get("report", {})
          require(exif_report.get("dateTransferPolicy") == "takeout-date-authoritative-generated-xmp-v1"
                  and exif_report.get("contents", [{}])[0].get("sha256")
                      == "26875c6fd8f73fffc3cc259086fa808ec22003ee20d5e69e9df1335a0d0ba058",
                  "PACKAGE_EXIF_SOURCE_DATE_POLICY_MISMATCH")
          print(json.dumps({"status": report["status"], "scope": report["scope"], "checks": len(checks),
                            "commands": len(commands), "metadataObservations": len(observations), "qualification": False}))
          '

      - name: Retain verified published compatibility inputs
        shell: bash
        env:
          MVP_PACKAGE_NAME: ${{ matrix.legacy_package }}
          MVP_PACKAGE_SHA256: ${{ matrix.legacy_sha256 }}
          MVP_SUMS_SHA256: ${{ matrix.legacy_sums_sha256 }}
          BETA_PACKAGE_NAME: ${{ matrix.beta_package }}
          BETA_PACKAGE_SHA256: ${{ matrix.beta_sha256 }}
          BETA_SUMS_SHA256: ${{ matrix.beta_sums_sha256 }}
        run: |
          set -euo pipefail
          python -B scripts/ci-test-report.py \
            --report artifacts/published-input-retention-command.json \
            --stdout-log artifacts/published-input-retention.stdout.log \
            --stderr-log artifacts/published-input-retention.stderr.log \
            -- python -B -c '
          import hashlib, json, os, re, stat
          from pathlib import Path
          def bounded_digest(path):
              info = path.lstat()
              limit = 64 * 1024 * 1024
              if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= limit:
                  raise SystemExit("PUBLISHED_INPUT_FILE_INVALID")
              digest = hashlib.sha256()
              count = 0
              with path.open("rb") as stream:
                  while True:
                      chunk = stream.read(min(1024 * 1024, limit - count + 1))
                      if not chunk:
                          break
                      count += len(chunk)
                      if count > limit:
                          raise SystemExit("PUBLISHED_INPUT_FILE_INVALID")
                      digest.update(chunk)
              if count != info.st_size:
                  raise SystemExit("PUBLISHED_INPUT_IDENTITY_MISMATCH")
              return count, digest.hexdigest()
          destination = Path("artifacts/published compatibility inputs")
          destination.mkdir(exist_ok=False)
          retained = []
          for label, version in (("mvp", "0.1.0"), ("beta", "0.2.0")):
              prefix = label.upper()
              name = os.environ[prefix + "_PACKAGE_NAME"]
              if Path(name).name != name or "/" in name or "\\" in name:
                  raise SystemExit("PUBLISHED_INPUT_NAME_INVALID")
              source = Path(os.environ["RUNNER_TEMP"]) / ("archivebridge-" + label + "-" + version)
              target = destination / label
              target.mkdir(exist_ok=False)
              for filename, pin in ((name, os.environ[prefix + "_PACKAGE_SHA256"]),
                                    ("published-SHA256SUMS.txt", os.environ[prefix + "_SUMS_SHA256"])):
                  path = source / filename
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 64 * 1024 * 1024:
                      raise SystemExit("PUBLISHED_INPUT_FILE_INVALID")
                  with path.open("rb") as stream:
                      raw = stream.read(64 * 1024 * 1024 + 1)
                  if not re.fullmatch("[0-9a-f]{64}", pin) or len(raw) != info.st_size or hashlib.sha256(raw).hexdigest() != pin:
                      raise SystemExit("PUBLISHED_INPUT_IDENTITY_MISMATCH")
                  with (target / filename).open("xb") as output:
                      output.write(raw)
                  if bounded_digest(target / filename) != (len(raw), pin) or bounded_digest(path) != (len(raw), pin):
                      raise SystemExit("PUBLISHED_INPUT_COPY_MISMATCH")
                  retained.append({"version": version, "name": filename, "bytes": len(raw), "sha256": pin})
          print(json.dumps({"status": "passed", "retained": retained}))
          '

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: archivebridge-ci-${{ matrix.platform }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: |
            artifacts/**
            release/**
